name: Build APK
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - name: Ficha de build dentro del APK (stamp + inyección en app.js)
        env:
          AGENT_MODEL: ${{ github.actor }}
        run: |
          python3 .agent/agent_mem.py stamp --out app/src/main/assets/build-info.json
          python3 -c "import json,pathlib; p=pathlib.Path('app/src/main/assets/app.js'); s=p.read_text(encoding='utf-8'); sentinel='const BUILD_INFO=null;'; assert sentinel in s, 'sentinel BUILD_INFO ausente en app.js'; p.write_text(s.replace(sentinel,'const BUILD_INFO='+json.dumps(json.load(open('app/src/main/assets/build-info.json')),ensure_ascii=False)+';',1),encoding='utf-8')"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Nombre versionado para el release
        run: |
          V=$(python3 -c "import json;d=json.load(open('app/src/main/assets/build-info.json'));print(d['versionName']+'-'+str(d['versionCode']))")
          cp app/build/outputs/apk/debug/app-debug.apk "saludapp-v$V.apk"
          echo "APK del release: saludapp-v$V.apk"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: saludapp-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
