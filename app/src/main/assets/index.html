<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SaludApp</title>
<style>
:root {
  --accent:#0E9F8A; --on-accent:#FFFFFF; --accent-soft:rgba(14,159,138,.12);
  --bg:#F6F7F9; --card:#FFFFFF; --line:#EFEFF0;
  --text-1:#1A1A1A; --text-2:#8A8A8E; --text-3:#C7C7CC;
  --ok:#1B7A43; --warn:#8A5A00; --warn-bg:#FFF4E5; --danger:#E0453A;
  --r:16px; --pad:16px; --gap:12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#121214; --card:#1E1E20; --line:#2A2A2E;
    --text-1:#F2F2F4; --text-2:#9A9AA0; --text-3:#5A5A60;
    --accent-soft:rgba(14,159,138,.18); --warn-bg:#2A2013; --warn:#E5B05C;
  }
}
* { -webkit-tap-highlight-color:transparent; box-sizing:border-box; user-select:none; }
input,textarea,select { user-select:text; }
body { background:var(--bg); color:var(--text-1); margin:0;
  font:400 15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; padding-bottom:96px; }
h2.overline { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); margin:20px 16px 6px; }
.card { background:var(--card); border-radius:var(--r); padding:var(--pad); margin:var(--gap) 16px 0; }
.card.hl { background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.row { display:flex; align-items:center; gap:12px; min-height:64px; }
.row .grow { flex:1; min-width:0; }
.row:active { opacity:.85; }
.t1 { font-size:16px; font-weight:600; }
.t2 { font-size:13px; color:var(--text-2); }
.meta { font-size:13px; color:var(--text-2); }
.overline-lb { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); }
.pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
.pill.ok { background:var(--accent-soft); color:var(--accent); }
.pill.warn { background:var(--warn-bg); color:var(--warn); }
.pill.gray { background:var(--line); color:var(--text-2); }
.ic { width:40px; height:40px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:none; }
.ic svg { width:20px; height:20px; }
.chiprow { display:flex; gap:8px; overflow-x:auto; padding:var(--gap) 16px 4px; scrollbar-width:none; }
.chiprow::-webkit-scrollbar { display:none; }
.chip { padding:8px 14px; border-radius:999px; font-size:13px; white-space:nowrap; background:var(--card); border:1.5px solid var(--line); color:var(--text-1); }
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.statrow { display:flex; gap:var(--gap); margin:var(--gap) 16px 0; }
.statrow .card { flex:1; margin:0; padding:12px 14px; }
.big { font-size:20px; font-weight:700; margin-top:2px; }
.fab { position:fixed; right:16px; bottom:96px; width:56px; height:56px; border-radius:50%;
  background:var(--accent); color:var(--on-accent); border:0; box-shadow:0 6px 18px rgba(14,159,138,.4);
  display:flex; align-items:center; justify-content:center; }
.fab svg { width:24px; height:24px; }
.fab:active, .btn:active { transform:scale(.97); }
.cta { position:fixed; left:16px; right:16px; bottom:96px; height:56px; border:0; border-radius:28px;
  background:var(--accent); color:var(--on-accent); font-size:15px; font-weight:700;
  box-shadow:0 6px 18px rgba(14,159,138,.35); }
.nav { position:fixed; bottom:0; left:0; right:0; height:64px; background:var(--card); border-top:1px solid var(--line); display:flex; }
.nav div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; gap:2px; color:var(--text-2); }
.nav svg { width:22px; height:22px; }
.nav .on { color:var(--accent); font-weight:700; }
/* sheet / modal */
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9; opacity:0; transition:opacity .2s; }
.sheet { position:fixed; left:0; right:0; bottom:0; max-height:88vh; overflow:auto; z-index:10;
  background:var(--bg); border-radius:24px 24px 0 0; padding:8px 0 24px; transform:translateY(100%); transition:transform .25s; }
.sheet.show { transform:translateY(0); }
.sheet-bg.show { opacity:1; }
.sheet h3 { margin:12px 16px 4px; font-size:17px; }
input.f, textarea.f, select.f { width:100%; background:var(--card); border:1.5px solid var(--line);
  border-radius:12px; padding:14px 12px; font:inherit; color:var(--text-1); margin:6px 0; }
input.f:focus, textarea.f:focus, select.f:focus { border-color:var(--accent); outline:none; }
.btn { display:block; width:calc(100% - 32px); margin:12px 16px 0; height:56px; border:0; border-radius:28px;
  background:var(--accent); color:var(--on-accent); font-size:15px; font-weight:700; }
.btn.ghost { background:transparent; border:1.5px solid var(--line); color:var(--text-1); box-shadow:none; }
.err { color:var(--danger); font-size:12px; margin:4px 16px 0; }
.empty { text-align:center; padding:48px 32px; }
.empty svg { width:72px; height:72px; color:var(--text-3); }
.empty .t1 { margin:12px 0 2px; }
.detail-head { background:var(--accent-soft); padding:16px; margin:0; }
.backrow { display:flex; align-items:center; gap:8px; padding:10px 16px 0; }
.backrow button { background:none; border:0; color:var(--accent); font:inherit; font-weight:700; padding:8px 8px 8px 0; display:flex; align-items:center; gap:4px; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" style="display:none"></nav>
<script src="app.js"></script>
</body>
</html>
