<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SaludApp</title>
<!--
  Sistema de color — ingeniería verificada (oct 2026)
  Matiz de marca #0E9F8A ≈ OKLCH(0.63, 0.113, 178.7) conservado. Escala construida en OKLCH y
  validada por WCAG 2.2 (cada par texto/fondo ≥ su mínimo). Roles semánticos: superficie,
  texto, acento-gráfico, acento-tinta (texto pequeño) y acento-profundo (relleno tras blanco).
  El modo noche usa superficies con tinte (#0C1415, no #000) para evitar halación y acentos
  desaturados. Referencia completa: colores del proyecto en AGENTS.md.
-->
<style>
:root {
  /* superficies — blanco con tinte de marca (más cálido que gris neutro) */
  --bg:#F5FAF9; --card:#FBFEFD; --line:#E0EBE8;
  /* texto — profundidad en el hue de la marca,前来 contrastes verificados */
  --text-1:#152527; --text-2:#526163; --text-3:#A9B3B5;
  /* acentos teal (tono 178.7 OKLCH) */
  --accent:#0F9F8A;             /* gráficos, iconos, sombras — 3.3:1 vs blanco (≥3) */
  --acc-deep:#008471;           /* relleno de CTA/chip.on — blanco encima: 4.6:1 */
  --acc-ink:#007D6B;            /* texto pequeño de acento — 4.7–5.1:1 */
  --accent-soft:#E3FAF5;        /* superficie teñida — mantenida por compatibilidad */
  --on-accent:#FFFFFF;
  /* semánticos con croma armonizada (0.10–0.17) en OKLCH */
  --ok:#1C7943;
  --warn:#946800; --warn-bg:#FFF6E1;
  --danger:#C13D33;             /* texto de error — 5.3:1 */
  /* geometría */
  --r:18px; --pad:16px; --gap:12px;
  /* elevación teñida de marca (no gris) */
  --elev-card:0 1px 2px rgba(21,37,39,.05), 0 3px 12px rgba(0,125,107,.06);
  --elev-cta:0 6px 18px rgba(0,132,113,.28);
  --spring:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0C1415; --card:#161D1D; --line:#232E2E;      /* radios con tinte, no #000 */
    --text-1:#EAEEEE; --text-2:#9CA7A7; --text-3:#6E7677;
    --accent:#6FC1B0;           /* iconos/gráficos brillantes — 7.2:1 vs tinte */
    --acc-deep:#008471;         /* relleno CTA — blanco 4.6:1 (consistente) */
    --acc-ink:#82C9B9;          /* texto de acento — 9.0:1 vs card */
    --accent-soft:#0F2B26;      /* superficie teñida oscura */
    --on-accent:#FFFFFF;
    --warn:#DEB369; --warn-bg:#2D2106;
    --danger:#E17669;
    --elev-card:0 1px 2px rgba(0,0,0,.35), 0 3px 14px rgba(0,0,0,.25);
    --elev-cta:0 6px 20px rgba(0,132,113,.35);
  }
}
* { -webkit-tap-highlight-color:transparent; box-sizing:border-box; user-select:none; }
input,textarea,select { user-select:text; }
html { -webkit-text-size-adjust:100%; }
body {
  background:var(--bg); color:var(--text-1); margin:0;
  font:400 15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
/* Aurora de marca: gradiente sutil que respira detrás del contenido (rol decorativo) */
body::before {
  content:""; position:fixed; z-index:-1; left:0; right:0; top:0; height:230px;
  background:linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%);
  pointer-events:none;
}
@media (prefers-color-scheme: dark) { body::before { opacity:.55; } }

/* ---------- tipografía ---------- */
h2.overline { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); margin:20px 16px 6px; }
.t1 { font-size:16px; font-weight:600; letter-spacing:-.01em; }
.t2 { font-size:13px; color:var(--text-2); }
.meta { font-size:13px; color:var(--text-2); }
.overline-lb { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); }

/* ---------- superficies: cards ---------- */
.card {
  background:var(--card); border-radius:var(--r); padding:var(--pad);
  margin:var(--gap) 16px 0; box-shadow:var(--elev-card);
  transition:transform .18s var(--spring), box-shadow .18s var(--spring);
}
/* tarjeta destacada: gradiente aurora teñido (no gris-hl) */
.card.hl {
  background:linear-gradient(135deg, var(--accent-soft) 0%, #C9F8F5 100%);
  border:1px solid rgba(15,159,138,.18); box-shadow:0 4px 18px rgba(0,132,113,.12);
}
@media (prefers-color-scheme: dark) {
  .card.hl { background:linear-gradient(135deg, #0F2B26 0%, #11423A 100%);
             border-color:rgba(111,193,176,.28); box-shadow:0 4px 18px rgba(0,0,0,.35); }
}
.row { display:flex; align-items:center; gap:12px; min-height:64px; }
.row .grow { flex:1; min-width:0; }
.row:active { opacity:.85; }

/* ---------- píldoras de estado ---------- */
.pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; transition:background-color .18s var(--spring), color .18s var(--spring); }
.pill.ok { background:var(--accent-soft); color:var(--acc-ink); }
.pill.warn { background:var(--warn-bg); color:var(--warn); }
.pill.gray { background:var(--line); color:var(--text-2); }

/* ---------- iconos con tinte de marca ---------- */
.ic {
  width:40px; height:40px; border-radius:13px;          /* squircle, no círculo: más moderno */
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; flex:none;
  transition:transform .18s var(--spring);
}
.ic svg { width:20px; height:20px; }
.row:active .ic { transform:scale(.94); }

/* ---------- chips ---------- */
.chiprow { display:flex; gap:8px; overflow-x:auto; padding:var(--gap) 16px 4px; scrollbar-width:none; }
.chiprow::-webkit-scrollbar { display:none; }
.chip {
  padding:8px 14px; border-radius:999px; font-size:13px; white-space:nowrap;
  background:var(--card); border:1.5px solid var(--line); color:var(--text-1);
  transition:background-color .18s var(--spring), border-color .18s var(--spring), color .18s var(--spring), transform .18s var(--spring);
}
.chip:active { transform:scale(.96); }
.chip.on {
  background:var(--acc-deep); border-color:var(--acc-deep); color:var(--on-accent);
  box-shadow:0 3px 10px rgba(0,132,113,.30);
}
@media (prefers-color-scheme: dark) {
  .chip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--acc-ink);
             box-shadow:none; }   /* oscuras: chip tintado, texto acento (sin halación) */
}

/* ---------- stats / filas ---------- */
.statrow { display:flex; gap:var(--gap); margin:var(--gap) 16px 0; }
.statrow .card { flex:1; margin:0; padding:12px 14px; }
.big { font-size:20px; font-weight:700; margin-top:2px; }

/* ---------- FAB / CTA ---------- */
.fab {
  position:fixed; right:16px; bottom:96px; width:56px; height:56px; border-radius:17px;  /* squircle */
  background:var(--accent); color:var(--on-accent); border:0; box-shadow:0 6px 18px rgba(15,159,138,.40);
  display:flex; align-items:center; justify-content:center;
  transition:transform .18s var(--spring), box-shadow .18s var(--spring);
}
.fab svg { width:24px; height:24px; }
.fab:active, .btn:active, .cta:active { transform:scale(.96); }
.cta {
  position:fixed; left:16px; right:16px; bottom:96px; height:56px; border:0; border-radius:28px;
  background:var(--acc-deep); color:var(--on-accent); font-size:15px; font-weight:700;
  box-shadow:var(--elev-cta);
}
@media (prefers-color-scheme: dark) {
  .fab { box-shadow:0 6px 22px rgba(0,0,0,.5); }
}

/* ---------- navegación inferior ---------- */
.nav {
  position:fixed; bottom:0; left:0; right:0; height:64px;
  background:var(--card); border-top:1px solid var(--line); display:flex;
  box-shadow:0 -4px 16px rgba(15,159,138,.06);
}
.nav div {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:10px; gap:3px; color:var(--text-2);
  transition:color .18s var(--spring);
}
.nav svg { width:22px; height:22px; transition:transform .22s var(--spring); }
.nav .on { color:var(--acc-ink); font-weight:700; }
.nav .on svg { transform:translateY(-2px) scale(1.08); }

/* ---------- sheet / modal (glass responsable) ---------- */
.sheet-bg {
  position:fixed; inset:0; background:rgba(12,20,21,.45); z-index:9;
  opacity:0; transition:opacity .2s var(--spring);
  backdrop-filter:blur(4px) saturate(120%);        /* solo sobre capa oscura sólida */
  -webkit-backdrop-filter:blur(4px) saturate(120%);
}
.sheet {
  position:fixed; left:0; right:0; bottom:0; max-height:88vh; overflow:auto; z-index:10;
  background:var(--bg); border-radius:28px 28px 0 0; padding:8px 0 24px;
  transform:translateY(100%); transition:transform .28s var(--spring);
}
.sheet.show { transform:translateY(0); }
.sheet-bg.show { opacity:1; }
.sheet::before {  /* agarradera */
  content:""; display:block; width:36px; height:4px; border-radius:999px;
  background:var(--line); margin:6px auto 4px;
}
.sheet h3 { margin:12px 16px 4px; font-size:17px; }
input.f, textarea.f, select.f {
  width:100%; background:var(--card); border:1.5px solid var(--line);
  border-radius:13px; padding:14px 12px; font:inherit; color:var(--text-1); margin:6px 0;
  transition:border-color .18s var(--spring), box-shadow .18s var(--spring);
}
input.f:focus, textarea.f:focus, select.f:focus {
  border-color:var(--accent); outline:none;
  box-shadow:0 0 0 3px rgba(15,159,138,.16);
}
.btn {
  display:block; width:calc(100% - 32px); margin:12px 16px 0; height:56px; border:0; border-radius:28px;
  background:var(--acc-deep); color:var(--on-accent); font-size:15px; font-weight:700;
  transition:transform .18s var(--spring), opacity .18s var(--spring);
}
.btn.ghost { background:transparent; border:1.5px solid var(--line); color:var(--text-1); box-shadow:none; }
.err { color:var(--danger); font-size:12px; font-weight:600; margin:4px 16px 0; }

/* ---------- estados ---------- */
.empty { text-align:center; padding:48px 32px; }
.empty svg { width:72px; height:72px; color:var(--text-3); }
.empty .t1 { margin:12px 0 2px; }
.detail-head { background:var(--accent-soft); padding:16px; margin:0; }
.backrow { display:flex; align-items:center; gap:8px; padding:10px 16px 0; }
.backrow button {
  background:none; border:0; color:var(--acc-ink); font:inherit; font-weight:700;
  padding:8px 8px 8px 0; display:flex; align-items:center; gap:4px; min-height:44px;  /* táctil WCAG */
}

/* ---------- accesibilidad ---------- */
:focus-visible { outline:3px solid rgba(0,125,107,.55); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion: reduce) {
  * { transition:none !important; animation:none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" style="display:none"></nav>
<script src="app.js"></script>
</body>
</html>
