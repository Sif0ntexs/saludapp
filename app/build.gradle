plugins { id 'com.android.application' }
android {
    namespace 'com.zyvo.saludapp'
    compileSdk 34
    defaultConfig {
        applicationId 'com.zyvo.saludapp'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Fix: kotlin-stdlib-jdk7/jdk8 1.7.x ahora vive dentro de kotlin-stdlib 1.8.x
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'alineacion con kotlin-stdlib 1.8.22 evita clases duplicadas'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'alineacion con kotlin-stdlib 1.8.22 evita clases duplicadas'
        }
    }
}
