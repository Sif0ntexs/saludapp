plugins { id 'com.android.application' }
android {
    namespace 'com.zyvo.saludapp'
    compileSdk 34
    defaultConfig {
        applicationId 'com.zyvo.saludapp'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    /* Firma estable: el keystore vive en el repo para que cada APK del CI
       pueda instalarse ENCIMA del anterior sin perder los datos locales. */
    signingConfigs {
        estable {
            storeFile file('keystore/saludapp-debug.p12')
            storeType 'PKCS12'
            storePassword 'saludapp'
            keyAlias 'saludapp'
            keyPassword 'saludapp'
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.estable
        }
        release {
            signingConfig signingConfigs.estable
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Fix: kotlin-stdlib-jdk7/jdk8 1.7.x ahora vive dentro de kotlin-stdlib 1.8.x
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'alineacion con kotlin-stdlib 1.8.22 evita clases duplicadas'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'alineacion con kotlin-stdlib 1.8.22 evita clases duplicadas'
        }
    }
}
